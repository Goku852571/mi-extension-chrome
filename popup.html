<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Studio Automático</title>
    <style>
        :root {
            --primary: #ff3d4f;
            --primary-hover: #e3273a;
            --secondary: #b91c2d;
            --accent: #4cc9f0;
            --success: #4ade80;
            --error: #f87171;
            --warning: #fbbf24;
            --bg-body: #080b12;
            --bg-card: rgba(18, 24, 36, 0.92);
            --bg-input: #171e2b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --radius-main: 16px;
            --radius-input: 10px;
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: auto;
            min-width: 320px;
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 90% 0%, rgba(255, 61, 79, 0.16), transparent 34%), linear-gradient(160deg, #080b12 0%, #101725 100%);
            color: var(--text-main);
            padding: 16px;
        }

        .container {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-main);
            padding: 18px;
            box-shadow: var(--shadow);
        }

        h2 {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-main);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding: 2px 2px 16px; border-bottom: 1px solid var(--border); }
        .app-mark { display: grid; width: 40px; height: 40px; flex: 0 0 40px; place-items: center; border-radius: 12px; background: linear-gradient(145deg, var(--primary), var(--secondary)); box-shadow: 0 8px 24px rgba(255, 61, 79, 0.24); }
        .app-subtitle { margin: 3px 0 0; color: var(--text-dim); font-size: 11px; }

        .section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: var(--radius-main);
            padding: 16px;
            margin-bottom: 14px;
        }

        .section h3 {
            margin: 0 0 18px 0;
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-input);
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        button:focus-visible {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 61, 79, 0.22);
            background: #1e293b;
        }

        input:disabled, select:disabled, button:disabled { opacity: .52; cursor: not-allowed; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-input);
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .status {
            padding: 12px 16px;
            border-radius: var(--radius-input);
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .status.success {
            background: rgba(74, 222, 128, 0.1);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .status.error {
            background: rgba(248, 113, 113, 0.1);
            color: var(--error);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .status.info {
            background: rgba(76, 201, 240, 0.1);
            color: var(--accent);
            border: 1px solid rgba(76, 201, 240, 0.2);
        }

        button {
            padding: 12px 20px;
            border-radius: var(--radius-input);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 10px;
            color: white;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) { filter: brightness(1.08); }

        #startProcess {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            box-shadow: 0 8px 24px -8px rgba(255, 61, 79, 0.55);
            font-size: 16px;
            padding: 16px;
        }

        #startProcess:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(67, 97, 238, 0.5);
        }

        #startProcess:active {
            transform: translateY(0);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .button-group button {
            flex: 1;
        }

        .btn-green {
            background: #10b981;
        }

        .btn-green:hover {
            background: #059669;
        }

        .btn-cyan {
            background: #06b6d4;
        }

        .btn-cyan:hover {
            background: #0891b2;
        }

        .btn-red {
            background: #ef4444;
        }

        .btn-red:hover {
            background: #dc2626;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-dim);
        }

        /* Progress Area */
        .counter-display {
            background: rgba(255, 255, 255, 0.03);
            padding: 18px;
            border-radius: var(--radius-main);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .date-display {
            font-size: 20px;
            font-weight: 700;
            color: var(--success);
            text-align: center;
            margin-bottom: 12px;
            font-family: 'Outfit', sans-serif;
        }

        .progress-container {
            height: 8px;
            background: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, var(--primary), #fb7185);
            width: 0%;
            border-radius: 4px;
        }

        .step-info {
            background: rgba(251, 191, 36, 0.05);
            color: var(--warning);
            padding: 12px;
            border-radius: var(--radius-input);
            font-size: 13px;
            text-align: center;
            border: 1px solid rgba(251, 191, 36, 0.2);
            margin-bottom: 20px;
        }

        .file-list {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-input);
            padding: 8px;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 8px;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .thumbnail-preview {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        /* Badge de flujo activo */
        .flow-badge {
            display: none;
            background: rgba(67, 97, 238, 0.15);
            border: 1px solid rgba(67, 97, 238, 0.35);
            color: #93c5fd;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Historial */
        .history-entry {
            display: grid;
            grid-template-columns: 28px 1fr auto auto;
            gap: 8px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .history-entry:last-child { border-bottom: none; }
        .history-name { font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-range { color: var(--accent); font-family: monospace; }
        .history-date { color: var(--text-dim); font-size: 11px; }
        #historyList { max-height: 200px; overflow-y: auto; }

        @media (max-width: 390px) {
            body { padding: 10px; }
            .container, .section { padding: 13px; }
            .button-group { flex-wrap: wrap; }
            .button-group button { min-width: 110px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
        }

    </style>
</head>

<body>
    <div class="container">
        <header class="app-header">
            <div class="app-mark" aria-hidden="true">▶</div>
            <div>
                <h2>YouTube Studio Automático</h2>
                <p class="app-subtitle">Programa y organiza tus publicaciones</p>
            </div>
        </header>

        <!-- Estado del proceso -->
        <div id="statusArea" role="status" aria-live="polite"></div>

        <!-- Detección de archivos en subida -->
        <div id="uploadDetectionSection" class="section" style="display: none;">
            <h3>📊 Detección de Archivos</h3>
            <div id="uploadDetectionInfo" class="status info">
                Detectando subidas activas...
            </div>
            <button id="refreshDetection" class="btn-green">🔄 Actualizar Detección</button>

            <div style="margin-top: 15px;">
                <label for="startingFileIndex">Iniciar desde el archivo Nº:</label>
                <input type="number" id="startingFileIndex" value="1" min="1">
            </div>
        </div>

        <!-- Configuración inicial -->
        <div id="configSection">
            <div class="section">
                <h3>⚙️ Configuración Guardada</h3>
                <label for="savedConfigs">Perfiles de subida:</label>
                <select id="savedConfigs"></select>
                <div class="button-group">
                    <button id="loadConfig" class="btn-green">📂 Cargar</button>
                    <button id="saveCurrentConfigBtn" class="btn-cyan">💾 Guardar</button>
                    <button id="deleteConfig" class="btn-red">🗑️ Borrar</button>
                </div>
                <div class="button-group" style="margin-top: 8px;">
                    <button id="exportConfigs" class="btn-outline" style="font-size: 12px;">📋 Copiar JSON</button>
                    <button id="importConfigs" class="btn-outline" style="font-size: 12px;">📥 Pegar JSON</button>
                </div>
            </div>

            <div class="section">
                <h3>📅 Parámetros de Automatización</h3>

                <label for="startDate">Fecha de inicio de publicación:</label>
                <div style="display: flex; gap: 8px; margin-bottom: 14px;">
                    <input type="date" id="startDate" style="margin-bottom: 0;">
                    <button id="resetStartDate" class="btn-outline" style="width: auto; margin-bottom: 0; padding: 0 12px;" title="Reiniciar a pasado mañana">📅+2</button>
                </div>

                <label for="fanficName">Nombre del FanFic / Serie:</label>
                <input type="text" id="fanficName" placeholder="Ej: Dragon Ball Multiverse">

                <label for="startingRange">Rango de capítulos inicial:</label>
                <select id="startingRange"></select>

                <div class="checkbox-group">
                    <input type="checkbox" id="weeklyIncrementEnabled">
                    <label for="weeklyIncrementEnabled" style="margin:0">Incremento semanal desde:</label>
                </div>
                <select id="weeklyIncrementRange" disabled></select>

                <div class="checkbox-group">
                    <input type="checkbox" id="patreonEnabled">
                    <label for="patreonEnabled" style="margin:0">Etiqueta "PATREON" en rango:</label>
                </div>
                <select id="patreonRange" disabled></select>

                <label>Frecuencia de publicación:</label>
                <div class="button-group"
                    style="margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 10px;">
                    <div class="checkbox-group" style="margin:0; background:none; flex:1">
                        <input type="radio" name="incrementType" value="day" id="incrementDay" checked>
                        <label for="incrementDay" style="margin:0">Diario</label>
                    </div>
                    <div class="checkbox-group" style="margin:0; background:none; flex:1">
                        <input type="radio" name="incrementType" value="week" id="incrementWeek">
                        <label for="incrementWeek" style="margin:0">Semanal</label>
                    </div>
                    <div class="checkbox-group" style="margin:0; background:none; flex:1">
                        <input type="radio" name="incrementType" value="random" id="incrementRandom">
                        <label for="incrementRandom" style="margin:0">Aleatorio</label>
                    </div>
                </div>

                <div class="checkbox-group" style="margin-bottom: 14px;">
                    <label for="randomMaxDays" id="randomMaxDaysLabel" style="margin:0; color: var(--text-dim);">Días aleatorios (1 a N):</label>
                    <input type="number" id="randomMaxDays" value="4" min="2" style="width: 70px; margin: 0 0 0 auto;"
                        disabled>
                </div>

                <div class="checkbox-group">
                    <input type="radio" id="incrementRepeat" name="incrementType" value="repeat">
                    <label for="incrementRepeat" style="margin:0">Repetir fecha</label>
                    <input type="number" id="repeatCount" value="1" min="1" style="width: 60px; margin: 0 0 0 auto;"
                        disabled>
                </div>

                <label style="margin-top: 15px;">Estado de Monetización:</label>
                <div class="checkbox-group">
                    <input type="radio" name="channelType" value="monetized" id="channelMonetized" checked>
                    <label for="channelMonetized" style="margin:0">Canal Monetizado</label>
                </div>
                <div class="checkbox-group">
                    <input type="radio" name="channelType" value="non-monetized" id="channelNonMonetized">
                    <label for="channelNonMonetized" style="margin:0">Sin Monetizar / Nuevo</label>
                </div>
                <div class="checkbox-group">
                    <input type="radio" name="channelType" value="monetization-disabled"
                        id="channelMonetizationDisabled">
                    <label for="channelMonetizationDisabled" style="margin:0">Monetización Desactivada</label>
                </div>

                <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
                    <label for="thumbnailFiles">🖼️ Miniaturas (Cíclicas):</label>
                    <input type="file" id="thumbnailFiles" multiple accept="image/*">
                    <div id="thumbnailList" class="file-list" style="display: none;"></div>
                </div>
            </div>

            <button id="resumeSavedProcess" style="display: none;" class="btn-green">🔄 Reanudar Proceso Anterior</button>
            <button id="startProcess">▶ Iniciar automatización</button>
            <button id="startIndividualProcess" class="btn-outline" style="margin-bottom: 15px;">⚡ Subida Individual</button>
            <div class="button-group">
                <button id="testConnection" class="btn-cyan">🔧 Probar Conexión</button>
                <button id="clearConfig" class="btn-red">🗑️ Limpiar Todo</button>
            </div>

            <!-- Historial de subidas -->
            <button id="toggleHistory" class="btn-outline" style="font-size: 13px; margin-top: 6px;">📜 Ver Historial</button>
            <div id="historySection" class="section" style="display: none; margin-top: 10px;">
                <h3>📜 Historial de Subidas</h3>
                <div id="historyList"></div>
                <button id="clearHistory" class="btn-red" style="margin-top: 10px; font-size: 12px;">🗑️ Limpiar Historial</button>
            </div>
        </div>

        <!-- Panel de control durante el proceso -->
        <div id="processSection" style="display: none;">
            <div class="counter-display">
                <div class="flow-badge" id="activeFlowBadge"></div>
                <div class="date-display" id="currentDate"></div>
                <div style="text-align: center; font-size: 14px; margin-bottom: 5px;">
                    <span style="color: var(--accent); font-weight: 600;" id="incrementedName"></span>
                </div>
                <div style="text-align: center; font-size: 12px; color: var(--text-dim);">
                    Original: <span id="originalName"></span>
                </div>
            </div>

            <div class="section" style="padding: 15px;">
                <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
                    <span id="currentVideo">Video 1</span>
                    <span id="currentRange">001-025</span>
                </div>

                <div class="progress-container" role="progressbar" aria-label="Progreso de videos">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div style="text-align: center; font-size: 12px; color: var(--text-dim);">
                    Progreso: <span id="videoProgress">1</span> de <span id="totalVideos">0</span>
                </div>

                <div class="button-group" style="margin-top: 15px;">
                    <button id="previousVideoInList" class="btn-outline">⬅️ Ant.</button>
                    <button id="nextVideoInList" class="btn-outline">Sig. ➡️</button>
                </div>
            </div>

            <div class="step-info" id="stepInfo">
                Iniciando motores de automatización...
            </div>

            <div class="button-group">
                <button id="pauseProcess" class="btn-cyan">⏸️ Pausar</button>
                <button id="skipVideo" class="btn-outline">⏭️ Saltar</button>
            </div>
            <button id="finishCurrentVideo" class="btn-cyan">🏁 Terminar Video Actual</button>
            <button id="stopProcess" class="btn-red">⏹️ Detener Proceso</button>

            <div class="button-group" style="margin-top: 12px;">
                <button id="previousStep" class="btn-outline" style="font-size: 12px;">⬅️ Paso Ant.</button>
                <button id="nextStep" class="btn-outline" style="font-size: 12px;">Paso Sig. ➡️</button>
            </div>

            <button id="manualNext" style="display: none;" class="btn-green">➡️ Continuar Manualmente</button>
            <button id="retryCurrentStep" style="display: none;" class="btn-cyan">🔁 Reintentar Paso Actual</button>

            <!-- Sección de finalización -->
            <div id="completionSection"
                style="display: none; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
                <button id="continueProcess" class="btn-green">🚀 Siguiente Lote</button>
                <button id="saveAndPauseProcess" class="btn-cyan">💾 Guardar y Salir</button>
            </div>
        </div>

        <!-- Botones de utilidad -->
        <div id="utilitySection" style="display: none; margin-top: 15px;">
            <div class="button-group">
                <button id="incrementCounter" class="btn-outline">➕ Rango</button>
                <button id="decrementCounter" class="btn-outline">➖ Rango</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
